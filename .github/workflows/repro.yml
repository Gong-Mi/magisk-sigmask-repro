name: magisk-sigmask-repro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runner image already ships Android SDK + sdkmanager; do NOT use
      # android-actions/setup-android (its default 'tools' package no longer exists)

      - name: Cache NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-27.0.12077973

      - name: Install NDK + build-tools
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34"

      - name: Build blockall (x86_64 + arm64 bionic)
        run: |
          TC=$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin
          $TC/x86_64-linux-android30-clang -O2 -Wall -o blockall blockall.c
          $TC/aarch64-linux-android30-clang -O2 -Wall -o blockall.arm64 blockall.c

      - name: Build ART probe dex
        run: |
          mkdir -p dexout
          javac --release 8 -d dexout P.java
          $ANDROID_SDK_ROOT/build-tools/34.0.0/d8 --min-api 30 --output . dexout/P.class
          mv classes.dex p.dex

      - uses: actions/upload-artifact@v4
        with:
          name: probes
          path: |
            blockall
            blockall.arm64
            p.dex
            run_tests.sh

  emulator:
    needs: build
    # ubuntu runners here have no usable KVM (nested virt unavailable) and
    # modern emulator x86_64 images refuse TCG. Apple Silicon macOS runners
    # use hypervisor.framework — arm64 image boots with native acceleration.
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: probes
          path: probes

      - name: Run tests on Android emulator (API 30 arm64-v8a)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: arm64-v8a
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot-save -noaudio -no-boot-anim
          script: |
            ABI=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')
            echo "device ABI: $ABI"
            case "$ABI" in
              arm64-v8a) BIN=probes/blockall.arm64 ;;
              *) BIN=probes/blockall ;;
            esac
            adb push $BIN /data/local/tmp/blockall
            adb push probes/p.dex /data/local/tmp/p.dex
            adb push probes/run_tests.sh /data/local/tmp/run_tests.sh
            adb shell chmod 755 /data/local/tmp/blockall /data/local/tmp/run_tests.sh
            OUT=$(adb shell "sh /data/local/tmp/run_tests.sh" 2>&1 || true)
            echo "$OUT"
            echo "$OUT" | grep -q 'RESULT:REPRODUCED'
